apiVersion: apps/v1
kind: Deployment
metadata:
  name: pl-chat-web
  labels:
    app: pl-chat-web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: pl-chat-web
  template:
    metadata:
      labels:
        app: pl-chat-web
    spec:
      containers:
        - name: web
          image: ghcr.io/OWNER/pl-chat-web:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          env:
            - name: NEXT_PUBLIC_API_URL
              valueFrom:
                secretKeyRef:
                  name: pl-chat-web-secrets
                  key: NEXT_PUBLIC_API_URL
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests:
              cpu: 150m
              memory: 192Mi
            limits:
              cpu: 750m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: pl-chat-web
spec:
  selector:
    app: pl-chat-web
  ports:
    - name: http
      port: 80
      targetPort: 3000
